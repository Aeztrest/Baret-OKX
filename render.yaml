# Render Blueprint — Baret (standalone OKX ASP service). Usage: render.com -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: baret-okx-api
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev is required: NODE_ENV=production below makes a plain
    # `npm install`/`npm ci` skip devDependencies (typescript, @types/node),
    # which the build step needs even though they're never shipped at runtime.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render sits behind a proxy — needed for correct client IPs (rate-limit, logs).
      - key: TRUST_PROXY
        value: "true"
      - key: X402_ENABLED
        value: "true"
      # Receiving wallet for x402 USDC payments. A public receiving address,
      # not a secret — safe to commit (unlike a private key).
      - key: X402_PAY_TO
        value: "0xeb58c7A8c125E15b8E73532e00C51dfF3469f71D"
      # TEMP for payment-flow testing: Base Sepolia (free testnet USDC).
      # Switch back to eip155:8453 (Base mainnet) before the OKX submission.
      - key: X402_NETWORK
        value: eip155:84532
      - key: X402_FACILITATOR_URL
        value: https://www.x402.org/facilitator
      - key: BARET_CHECK_PRICE
        value: "$0.01"
      - key: BARET_CHECK_PRICE_ATOMIC
        value: "10000"
